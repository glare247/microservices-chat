apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chat-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/glare247/microservices-chat
    targetRevision: master
    path: k8s
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: chat-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
