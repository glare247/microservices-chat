# ═══════════════════════════════════════════════════════
# CI — SECURITY NIGHTLY SCAN
# Runs every night at 2AM
# Catches new vulnerabilities discovered
# after last code push
# ═══════════════════════════════════════════════════════
name: CI — Security Nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  REGISTRY:   us-central1-docker.pkg.dev
  PROJECT_ID: microservices-chat-496017
  REPOSITORY: chat-platform-cluster-registry

jobs:
  # ═══════════════════════════════════════
  # NIGHTLY SECURITY SCAN
  # ═══════════════════════════════════════
  security-scan:
    name: Nightly Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    steps:
      # ─────────────────────────────────
      # STEP 1 — Checkout full git history
      # WHY: trufflehog needs full history
      #      to scan all commits for secrets
      # ─────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─────────────────────────────────
      # STEP 2 — Setup Python
      # WHY: pip-audit and bandit
      #      are Python tools
      # ─────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # ─────────────────────────────────
      # STEP 3 — pip-audit dependency scan
      # WHY: Check all 3 requirements.txt
      #      files for known CVEs
      #      in Python dependencies
      # FILE: chat_front/requirements.txt
      # FILE: chat_svc/requirements.txt
      # FILE: chat_db/requirements.txt
      # ─────────────────────────────────
      - name: pip-audit — full dependency scan
        run: |
          pip install pip-audit
          pip-audit \
            -r chat_front/requirements.txt \
            -r chat_svc/requirements.txt \
            -r chat_db/requirements.txt \
            --ignore-vuln GHSA-h75v-3vvj-5mfj \
            --ignore-vuln GHSA-jfh8-c2jp-jgg
        continue-on-error: true

      # ─────────────────────────────────
      # STEP 4 — bandit security scan
      # WHY: Scan Python code in
      #      chat_front/project/main.py
      #      chat_svc/project/main.py
      #      chat_db/project/__init__.py
      #      for security issues
      # ─────────────────────────────────
      - name: bandit — Python security scan
        run: |
          pip install bandit
          bandit \
            -r chat_front/ chat_svc/ chat_db/ \
            -ll \
            --exclude */test*,*/.git/*
        continue-on-error: true

      # ─────────────────────────────────
      # STEP 5 — trufflehog secret scan
      # WHY: Scan entire git history
      #      for accidentally committed
      #      secrets passwords API keys
      # ─────────────────────────────────
      - name: trufflehog — full history secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ""
          head: HEAD
          extra_args: --only-verified
        continue-on-error: true

      # ─────────────────────────────────
      # STEP 6 — Authenticate to GCP
      # WHY: Need GCP credentials to
      #      pull images from
      #      Artifact Registry for
      #      Trivy image scanning
      #      Uses Workload Identity
      #      no JSON keys needed
      # ─────────────────────────────────
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      # ─────────────────────────────────
      # STEP 7 — Configure Docker for GCP
      # WHY: Allow Docker to pull images
      #      from Artifact Registry
      #      using GCP credentials
      # ─────────────────────────────────
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            us-central1-docker.pkg.dev \
            --quiet

      # ─────────────────────────────────
      # STEP 8 — Trivy scan chat-front
      # WHY: Scan chat-front Docker image
      #      for OS and Python package
      #      vulnerabilities
      # FILE: chat_front/Dockerfile
      # ─────────────────────────────────
      - name: Trivy — scan chat-front image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: >-
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/chat-front:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # ─────────────────────────────────
      # STEP 9 — Trivy scan chat-svc
      # WHY: Scan chat-svc Docker image
      #      for vulnerabilities
      # FILE: chat_svc/Dockerfile
      # ─────────────────────────────────
      - name: Trivy — scan chat-svc image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: >-
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/chat-svc:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # ─────────────────────────────────
      # STEP 10 — Trivy scan chat-db
      # WHY: Scan chat-db Docker image
      #      for vulnerabilities
      # FILE: chat_db/Dockerfile
      # ─────────────────────────────────
      - name: Trivy — scan chat-db image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: >-
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/chat-db:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          ignore-unfixed: true
