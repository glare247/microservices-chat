# ═══════════════════════════════════════
# GRAFANA HELM VALUES
# Accessible at grafana.chatms.store
# ═══════════════════════════════════════

adminUser: admin
adminPassword: "GrafanaAdmin2025!"

service:
  type: ClusterIP
  port: 80

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
        access: proxy

      - name: Loki
        type: loki
        url: http://loki.monitoring.svc.cluster.local:3100
        access: proxy

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    # KEPT: Node exporter full
    # Shows CPU memory disk network
    # per node - FULLY WORKING
    node-exporter:
      gnetId: 1860
      revision: 37
      datasource: Prometheus

    # KEPT: NGINX Ingress dashboard
    # Shows request volume connections
    # error rates - FULLY WORKING
    nginx-ingress:
      gnetId: 9614
      revision: 1
      datasource: Prometheus

    # ADDED: Kubernetes cluster monitoring
    # Shows cluster memory CPU network
    # WORKING: memory 45.2% CPU 1.03%
    cluster-monitoring:
      gnetId: 3119
      revision: 2
      datasource: Prometheus

persistence:
  enabled: true
  size: 5Gi

resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 256Mi
    cpu: 200m
