# ═══════════════════════════════════════
# PROMETHEUS HELM VALUES
# ═══════════════════════════════════════

server:
  persistentVolume:
    size: 10Gi

  retention: "2d"

  startupProbe:
    httpGet:
      path: /-/healthy
      port: 9090
    failureThreshold: 120
    periodSeconds: 15
    timeoutSeconds: 10

  livenessProbe:
    httpGet:
      path: /-/healthy
      port: 9090
    initialDelaySeconds: 300
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /-/ready
      port: 9090
    initialDelaySeconds: 300
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3

  resources:
    requests:
      memory: 512Mi
      cpu: 200m
    limits:
      memory: 1Gi
      cpu: 500m

extraScrapeConfigs: |
  # KEPT: node-exporter custom job
  # Renames node-exporter metrics
  # to job=node-exporter
  - job_name: 'node-exporter'
    kubernetes_sd_configs:
      - role: service
        namespaces:
          names:
            - monitoring
    relabel_configs:
      - source_labels:
          [__meta_kubernetes_service_name]
        action: keep
        regex: prometheus-prometheus-node-exporter
      - source_labels:
          [__meta_kubernetes_service_label_app_kubernetes_io_instance]
        action: replace
        target_label: instance
        replacement: node-exporter

  # KEPT: nginx-ingress custom job
  # Scrapes NGINX metrics
  - job_name: 'nginx-ingress'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - ingress-nginx
    relabel_configs:
      - source_labels:
          [__meta_kubernetes_service_name]
        action: keep
        regex: ingress-nginx-controller-metrics

  # REMOVED: kubernetes-pods job
  # WHY: Helm chart already creates
  #      this job by default
  #      Having it twice caused:
  #      "found multiple scrape configs
  #       with job name kubernetes-pods"
  #      Prometheus refused to start

alertmanager:
  enabled: false

pushgateway:
  enabled: false

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
