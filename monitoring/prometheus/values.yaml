# ═══════════════════════════════════════
# PROMETHEUS HELM VALUES
# ═══════════════════════════════════════

server:
  persistentVolume:
    size: 10Gi

  retention: "7d"

  startupProbe:
    httpGet:
      path: /-/healthy
      port: 9090
    failureThreshold: 60
    periodSeconds: 15
    timeoutSeconds: 10

  livenessProbe:
    httpGet:
      path: /-/healthy
      port: 9090
    initialDelaySeconds: 300
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /-/ready
      port: 9090
    initialDelaySeconds: 300
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3

  resources:
    requests:
      memory: 512Mi
      cpu: 200m
    limits:
      memory: 1Gi
      cpu: 500m

extraScrapeConfigs: |
  # ─────────────────────────────────────
  # NODE EXPORTER JOB
  # CHANGED: role: endpoints → role: service
  # WHY: Dropped target showed
  #      role was service not endpoints
  #      service discovery finds it
  #      endpoints discovery drops it
  # ─────────────────────────────────────
  - job_name: 'node-exporter'
    kubernetes_sd_configs:
      - role: service
        namespaces:
          names:
            - monitoring
    relabel_configs:
      # UNCHANGED: match service name
      - source_labels:
          [__meta_kubernetes_service_name]
        action: keep
        regex: prometheus-prometheus-node-exporter
      # UNCHANGED: set instance label
      - source_labels:
          [__meta_kubernetes_service_label_app_kubernetes_io_instance]
        action: replace
        target_label: instance
        replacement: node-exporter

  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels:
          [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels:
          [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels:
          [__address__,
           __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels:
          [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels:
          [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name
      - source_labels:
          [__meta_kubernetes_pod_label_app]
        action: replace
        target_label: app

  - job_name: 'nginx-ingress'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - ingress-nginx
    relabel_configs:
      - source_labels:
          [__meta_kubernetes_service_name]
        action: keep
        regex: ingress-nginx-controller-metrics

alertmanager:
  enabled: false

pushgateway:
  enabled: false

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
