# ═══════════════════════════════════════════════════════════════
# GOOGLE MANAGED SSL CERTIFICATE
# Covers all subdomains of chatms.store
# Auto issued and renewed by Google
# ═══════════════════════════════════════════════════════════════
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: chat-certificate
  namespace: chat-app
spec:
  domains:
    - chatms.store
    - www.chatms.store
    - argocd.chatms.store
    - grafana.chatms.store
