name: CI — Infrastructure

on:
  push:
    branches: [master]
    paths:
      - 'terraform/**'
  pull_request:
    branches: [master]
    paths:
      - 'terraform/**'

env:
  TF_VAR_project_id:              microservices-chat-496017
  TF_VAR_region:                  us-central1
  TF_VAR_zone:                    us-central1-a
  TF_VAR_cluster_name:            chat-platform-cluster
  TF_VAR_machine_type:            e2-medium
  TF_VAR_node_count:              "1"
  TF_VAR_min_node_count:          "1"
  TF_VAR_max_node_count:          "4"
  TF_VAR_public_subnet_cidr:      10.0.1.0/24
  TF_VAR_private_subnet_cidr:     10.0.2.0/24
  TF_VAR_pods_cidr:               10.1.0.0/16
  TF_VAR_services_cidr:           10.2.0.0/16
  TF_VAR_db_instance_name:        chat-postgres-db
  TF_VAR_db_name:                 chatdb
  TF_VAR_db_user:                 chatuser
  TF_VAR_db_tier:                 db-f1-micro
  TF_VAR_domain_name:             chatms.store
  TF_VAR_github_repository_owner: glare247
  TF_VAR_github_repository:       glare247/microservices-chat

jobs:

# ═══════════════════════════════════════════
# SCAN TERRAFORM CODE
# ═══════════════════════════════════════════
  scan-terraform:
    name: Scan Terraform Code
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: tfsec — Terraform security scan
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: terraform/
          soft_fail: false

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: tflint — Terraform code quality
        run: |
          cd terraform/
          tflint --init
          tflint

      - name: checkov — Infrastructure compliance
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false

# ═══════════════════════════════════════════
# TERRAFORM PLAN — ON PULL REQUEST
# ═══════════════════════════════════════════
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: scan-terraform
    if: github.event_name == 'pull_request'
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform -chdir=terraform/ init

      - name: Terraform Plan
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: terraform -chdir=terraform/ plan -no-color
        continue-on-error: true

# ═══════════════════════════════════════════
# TERRAFORM APPLY — ON MERGE TO MASTER
# ═══════════════════════════════════════════
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: scan-terraform
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    timeout-minutes: 60

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform -chdir=terraform/ init

      - name: Terraform Apply
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: terraform -chdir=terraform/ apply -auto-approve
