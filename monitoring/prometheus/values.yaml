# ═══════════════════════════════════════
# PROMETHEUS HELM VALUES
# Scrapes metrics from all pods
# ═══════════════════════════════════════

server:
  persistentVolume:
    size: 10Gi

  retention: "7d"

  # ADDED: Extra time for WAL replay
  # WHY: Prometheus has 378 WAL segments
  #      Takes up to 15 minutes to load
  #      Default probe kills pod too early
  livenessProbe:
    httpGet:
      path: /-/healthy
      port: 9090
    initialDelaySeconds: 300
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /-/ready
      port: 9090
    initialDelaySeconds: 300
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3

  # ADDED: Startup probe
  # WHY: Allows up to 15 minutes
  #      for initial WAL replay
  #      Before liveness takes over
  startupProbe:
    httpGet:
      path: /-/healthy
      port: 9090
    failureThreshold: 60
    periodSeconds: 15
    timeoutSeconds: 10

  resources:
    requests:
      memory: 512Mi
      cpu: 200m
    limits:
      memory: 1Gi
      cpu: 500m

  extraScrapeConfigs: |
    - job_name: 'kubernetes-pods'
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        - source_labels:
            [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: true
        - source_labels:
            [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels:
            [__address__,
             __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__
        - source_labels:
            [__meta_kubernetes_namespace]
          action: replace
          target_label: kubernetes_namespace
        - source_labels:
            [__meta_kubernetes_pod_name]
          action: replace
          target_label: kubernetes_pod_name
        - source_labels:
            [__meta_kubernetes_pod_label_app]
          action: replace
          target_label: app

    - job_name: 'nginx-ingress'
      static_configs:
        - targets:
          - ingress-nginx-controller-metrics.ingress-nginx.svc.cluster.local:10254

alertmanager:
  enabled: false

pushgateway:
  enabled: false

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
