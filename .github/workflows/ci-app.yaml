name: CI — Application

on:
  push:
    branches: [master]
    paths:
      - 'chat_front/**'
      - 'chat_svc/**'
      - 'chat_db/**'
  pull_request:
    branches: [master]
    paths:
      - 'chat_front/**'
      - 'chat_svc/**'
      - 'chat_db/**'

env:
  REGISTRY:   us-central1-docker.pkg.dev
  PROJECT_ID: microservices-chat-496017
  REPOSITORY: chat-platform-cluster-registry
  REGION:     us-central1

jobs:

# ═══════════════════════════════════════════
# STAGE 1 — SCAN APPLICATION CODE
# ═══════════════════════════════════════════
  scan-code:
    name: Scan Application Code
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install scanning tools
        run: pip install flake8 bandit pip-audit

      - name: flake8 — Python code quality
        run: |
          flake8 chat_front/ chat_svc/ chat_db/ \
            --max-line-length=130 \
            --exclude=__pycache__,*.pyc,setup.py \
            --count \
            --statistics

      - name: bandit — Python security scan
        run: |
          bandit -r chat_front/ chat_svc/ chat_db/ \
            -ll \
            --exclude tests \
            -f txt

      - name: pip-audit — dependency vulnerability scan
        run: |
          pip-audit \
            -r chat_db/requirements.txt \
            -r chat_svc/requirements.txt \
            -r chat_front/requirements.txt

# ═══════════════════════════════════════════
# STAGE 2 — BUILD SCAN AND PUSH IMAGES
# ═══════════════════════════════════════════
  build-push:
    name: Build Scan and Push Images
    runs-on: ubuntu-latest
    needs: scan-code
    timeout-minutes: 45

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            us-central1-docker.pkg.dev \
            --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ─── chat_front ──────────────────────
      - name: Build chat_front
        uses: docker/build-push-action@v5
        with:
          context: chat_front/
          file: chat_front/Dockerfile
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/chat-front:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy — scan chat_front
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/chat-front:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Push chat_front
        if: github.ref == 'refs/heads/master'
        run: |
          docker push \
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/chat-front:${{ github.sha }}
          docker tag \
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/chat-front:${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/chat-front:latest
          docker push \
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/chat-front:latest

      # ─── chat_svc ────────────────────────
      - name: Build chat_svc
        uses: docker/build-push-action@v5
        with:
          context: chat_svc/
          file: chat_svc/Dockerfile
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/chat-svc:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy — scan chat_svc
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/chat-svc:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Push chat_svc
        if: github.ref == 'refs/heads/master'
        run: |
          docker push \
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/chat-svc:${{ github.sha }}
          docker tag \
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/chat-svc:${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/chat-svc:latest
          docker push \
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/chat-svc:latest

      # ─── chat_db ─────────────────────────
      - name: Build chat_db
        uses: docker/build-push-action@v5
        with:
          context: chat_db/
          file: chat_db/Dockerfile
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/chat-db:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy — scan chat_db
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/chat-db:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Push chat_db
        if: github.ref == 'refs/heads/master'
        run: |
          docker push \
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/chat-db:${{ github.sha }}
          docker tag \
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/chat-db:${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/chat-db:latest
          docker push \
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/chat-db:latest

# ═══════════════════════════════════════════
# STAGE 3 — UPDATE KUBERNETES MANIFESTS
# ═══════════════════════════════════════════
  update-manifests:
    name: Update K8s Manifests
    runs-on: ubuntu-latest
    needs: build-push
    timeout-minutes: 10
    if: github.ref == 'refs/heads/master'

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update chat_front image tag
        run: |
          sed -i \
            "s|image: .*/chat-front:.*|image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/chat-front:${{ github.sha }}|g" \
            k8s/chat-front/deployment.yaml

      - name: Update chat_svc image tag
        run: |
          sed -i \
            "s|image: .*/chat-svc:.*|image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/chat-svc:${{ github.sha }}|g" \
            k8s/chat-svc/deployment.yaml

      - name: Update chat_db image tag
        run: |
          sed -i \
            "s|image: .*/chat-db:.*|image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/chat-db:${{ github.sha }}|g" \
            k8s/chat-db/deployment.yaml

      - name: Commit and push manifest updates
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "GitHub Actions Bot"
          git add k8s/
          git diff --staged --quiet || \
            git commit -m "ci: update image tags to ${{ github.sha }}

            Registry: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}
            Updated images:
            - chat-front:${{ github.sha }}
            - chat-svc:${{ github.sha }}
            - chat-db:${{ github.sha }}"
          git push
