# ═══════════════════════════════════════════════════════════════
# ARGOCD HELM VALUES
# Accessible at http://argocd.chatms.store
# SSL terminated at GCP Load Balancer
# ArgoCD runs HTTP internally (server.insecure=true)
# ═══════════════════════════════════════════════════════════════

configs:
  params:
    server.insecure: "true"

server:
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: gce
    hostname: argocd.chatms.store
    annotations:
      kubernetes.io/ingress.class: "gce"
      kubernetes.io/ingress.global-static-ip-name: chat-platform-cluster-lb-ip
      kubernetes.io/ingress.allow-http: "true"
