# ═══════════════════════════════════════
# GRAFANA HELM VALUES
# Accessible at grafana.chatms.store
# ═══════════════════════════════════════

adminUser: admin
adminPassword: "GrafanaAdmin2025!"

service:
  type: ClusterIP
  port: 80

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
        access: proxy

      - name: Loki
        type: loki
        url: http://loki.monitoring.svc.cluster.local:3100
        access: proxy

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    # CHANGED: gnetId 1860 → 11074
    # WHY: gnetId 1860 Node Exporter Full
    #      requires job=node-exporter
    #      Our Prometheus uses
    #      job=kubernetes-service-endpoints
    #      Dashboard showed N/A for all gauges
    #
    #      gnetId 11074 works with
    #      any job name automatically
    #      No UI variable configuration needed
    node-exporter:
      gnetId: 11074
      revision: 9
      datasource: Prometheus

    # UNCHANGED: NGINX Ingress controller
    nginx-ingress:
      gnetId: 9614
      revision: 1
      datasource: Prometheus

    # UNCHANGED: Kubernetes cluster monitoring
    cluster-monitoring:
      gnetId: 3119
      revision: 2
      datasource: Prometheus

persistence:
  enabled: true
  size: 5Gi

resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 256Mi
    cpu: 200m
