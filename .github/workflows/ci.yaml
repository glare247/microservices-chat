name: CI Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:

  scan-code:
    name: Scan Application Code
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install scanning tools
        run: pip install flake8 bandit safety

      - name: flake8
        run: |
          flake8 chat_front/ chat_svc/ chat_db/ \
            --max-line-length=120 \
            --exclude=__pycache__,*.pyc,setup.py \
            --count \
            --statistics

      - name: bandit
        run: |
          bandit -r chat_front/ chat_svc/ chat_db/ \
            -ll \
            --exclude tests \
            -f txt

      - name: safety
        run: |
          safety check \
            -r chat_db/requirements.txt \
            -r chat_svc/requirements.txt \
            -r chat_front/requirements.txt

      - name: trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: master
          head: HEAD
          extra_args: --only-verified

  scan-terraform:
    name: Scan Terraform Code
    runs-on: ubuntu-latest
    needs: scan-code
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: terraform/
          soft_fail: false

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: tflint
        run: |
          cd terraform/
          tflint --init
          tflint

      - name: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false

  build-push:
    name: Build Scan and Push Images
    runs-on: ubuntu-latest
    needs: scan-terraform
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build chat_front
        uses: docker/build-push-action@v5
        with:
          context: chat_front/
          file: chat_front/Dockerfile
          push: false
          load: true
          tags: ${{ secrets.DOCKER_USERNAME }}/chat-front:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy chat_front
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/chat-front:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Push chat_front
        if: github.ref == 'refs/heads/master'
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/chat-front:${{ github.sha }}
          docker tag \
            ${{ secrets.DOCKER_USERNAME }}/chat-front:${{ github.sha }} \
            ${{ secrets.DOCKER_USERNAME }}/chat-front:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/chat-front:latest

      - name: Build chat_svc
        uses: docker/build-push-action@v5
        with:
          context: chat_svc/
          file: chat_svc/Dockerfile
          push: false
          load: true
          tags: ${{ secrets.DOCKER_USERNAME }}/chat-svc:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy chat_svc
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/chat-svc:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Push chat_svc
        if: github.ref == 'refs/heads/master'
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/chat-svc:${{ github.sha }}
          docker tag \
            ${{ secrets.DOCKER_USERNAME }}/chat-svc:${{ github.sha }} \
            ${{ secrets.DOCKER_USERNAME }}/chat-svc:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/chat-svc:latest

      - name: Build chat_db
        uses: docker/build-push-action@v5
        with:
          context: chat_db/
          file: chat_db/Dockerfile
          push: false
          load: true
          tags: ${{ secrets.DOCKER_USERNAME }}/chat-db:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy chat_db
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/chat-db:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Push chat_db
        if: github.ref == 'refs/heads/master'
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/chat-db:${{ github.sha }}
          docker tag \
            ${{ secrets.DOCKER_USERNAME }}/chat-db:${{ github.sha }} \
            ${{ secrets.DOCKER_USERNAME }}/chat-db:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/chat-db:latest

  update-manifests:
    name: Update K8s Manifests
    runs-on: ubuntu-latest
    needs: build-push
    timeout-minutes: 10
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update chat_front image tag
        run: |
          sed -i \
            "s|image: .*/chat-front:.*|image: ${{ secrets.DOCKER_USERNAME }}/chat-front:${{ github.sha }}|g" \
            k8s/chat-front/deployment.yaml

      - name: Update chat_svc image tag
        run: |
          sed -i \
            "s|image: .*/chat-svc:.*|image: ${{ secrets.DOCKER_USERNAME }}/chat-svc:${{ github.sha }}|g" \
            k8s/chat-svc/deployment.yaml

      - name: Update chat_db image tag
        run: |
          sed -i \
            "s|image: .*/chat-db:.*|image: ${{ secrets.DOCKER_USERNAME }}/chat-db:${{ github.sha }}|g" \
            k8s/chat-db/deployment.yaml

      - name: Commit and push manifest updates
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "GitHub Actions Bot"
          git add k8s/
          git diff --staged --quiet || \
            git commit -m "ci: update image tags to ${{ github.sha }}

            Updated images:
            - chat-front:${{ github.sha }}
            - chat-svc:${{ github.sha }}
            - chat-db:${{ github.sha }}"
          git push